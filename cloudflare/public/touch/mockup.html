<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Touch Controls Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap">
<style>
/* [touch] Static design mockup (not loaded by the game page). ?ctx=foot|combat|vehicle|dialogue|menu shows one frame. */
:root{--red:#ff5a4e;--red-dim:rgba(255,90,78,.55);--cyan:#5ef6ff;--fill:rgba(18,8,10,.42);--fill-hot:rgba(255,90,78,.16);--page:#0b0b0e;--text:#e8e8ea}
html,body{margin:0;background:var(--page);color:var(--text);font-family:Rajdhani,system-ui,sans-serif}
.wrap{padding:24px 16px 60px;display:flex;flex-direction:column;align-items:center;gap:36px}
h1{font-size:20px;letter-spacing:.18em;text-transform:uppercase;color:var(--red);margin:0}
.cap{width:min(1280px,100%);display:flex;justify-content:space-between;align-items:baseline;gap:16px;font-size:14px;color:#aaa;letter-spacing:.04em}
.cap b{color:var(--red);font-size:16px;letter-spacing:.16em;text-transform:uppercase}
.scaler{width:min(1280px,100%);aspect-ratio:1280/709;position:relative;overflow:hidden}
.frame{position:absolute;left:0;top:0;width:1280px;height:709px;transform-origin:0 0;background-size:cover}
.frame.dim::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.35)}
body.single .wrap{padding:0;gap:0}body.single h1,body.single .cap{display:none}
body.single .scaler{width:100vw;max-width:none}
.key,.chip .k{display:none}  /* mobile only: no PC key chips (lead 2026-10-20) */

/* ---- control primitives ---- */
.c{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:none}
.btn{position:relative;width:var(--w);height:var(--w);display:flex;align-items:center;justify-content:center}
.btn svg.f{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.btn svg.f .o{fill:var(--fill);stroke:var(--red);stroke-width:1.5;vector-effect:non-scaling-stroke}
.btn svg.f .i{fill:none;stroke:var(--red-dim);stroke-width:1;vector-effect:non-scaling-stroke}
.btn svg.g{position:relative;width:46%;height:46%;fill:none;stroke:var(--red);stroke-width:1.6;stroke-linecap:square;stroke-linejoin:miter}
.btn.primary svg.f .o{fill:var(--fill-hot)}
.btn.primary svg.g{stroke:var(--red);width:42%;height:42%}
.btn.hot svg.f .o{fill:rgba(255,90,78,.38);stroke:#ff8a80}
.btn.hot{filter:drop-shadow(0 0 8px rgba(255,90,78,.7))}
.key{position:absolute;right:-5px;bottom:-5px;min-width:16px;height:16px;padding:0 3px;box-sizing:border-box;font-size:11px;font-weight:700;line-height:14px;
  text-align:center;color:var(--cyan);background:rgba(6,16,18,.8);border:1px solid var(--cyan)}
.lbl{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--red);text-shadow:0 1px 2px #000,0 0 4px #000;white-space:nowrap}
.note{position:absolute;font-size:12px;letter-spacing:.06em;color:var(--cyan);background:rgba(4,12,14,.7);border-left:2px solid var(--cyan);padding:3px 8px;white-space:nowrap}
/* stick */
.stick{width:var(--w);height:var(--w)}
.stick svg{width:100%;height:100%;overflow:visible}
.stick .ring{fill:rgba(18,8,10,.28);stroke:var(--red);stroke-width:1.2}
.stick .tick{stroke:var(--red);stroke-width:1.5}
.stick .spr{fill:none;stroke:var(--cyan);stroke-width:1;stroke-dasharray:3 5;opacity:.7}
.stick .knob{fill:rgba(94,246,255,.12);stroke:var(--cyan);stroke-width:1.5}
/* wide chips (interact prompt, exit, back, top strip) */
.chip{position:relative;height:var(--h,34px);padding:0 12px 0 8px;display:flex;align-items:center;gap:8px;
  font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
.chip svg.f{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.chip svg.f .o{fill:var(--fill);stroke:var(--red);stroke-width:1.2;vector-effect:non-scaling-stroke}
.chip .k{position:relative;min-width:20px;height:20px;box-sizing:border-box;border:1px solid var(--cyan);color:var(--cyan);font-size:12px;line-height:18px;text-align:center;padding:0 4px;background:rgba(6,16,18,.8)}
.chip span{position:relative}
.chip svg.g{position:relative;width:18px;height:18px;fill:none;stroke:var(--red);stroke-width:1.6}
.strip{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px}
.strip .chip{--h:30px;padding:0 9px}
/* pedals */
.pedal{position:relative;width:var(--pw);height:var(--ph);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.pedal svg.f{position:absolute;inset:0;width:100%;height:100%}
.pedal svg.f .o{fill:var(--fill);stroke:var(--red);stroke-width:1.5;vector-effect:non-scaling-stroke}
.pedal svg.f .i{fill:none;stroke:var(--red-dim);stroke-width:1;vector-effect:non-scaling-stroke}
.pedal svg.g{position:relative;width:26px;height:26px;fill:none;stroke:var(--red);stroke-width:1.6}
.pedal.primary svg.f .o{fill:var(--fill-hot)}
.steer{position:relative;width:250px;height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;box-sizing:border-box}
.steer svg.f{position:absolute;inset:0;width:100%;height:100%}
.steer svg.f .o{fill:rgba(18,8,10,.3);stroke:var(--red);stroke-width:1.2;vector-effect:non-scaling-stroke}
.steer svg.g{position:relative;width:22px;height:22px;fill:none;stroke:var(--red);stroke-width:1.6}
.steer .mid{position:absolute;left:50%;top:8px;bottom:8px;width:0;border-left:1px dashed var(--red-dim)}
.steer .knob{position:absolute;left:62%;top:50%;width:14px;height:30px;transform:translate(-50%,-50%);border:1.5px solid var(--cyan);background:rgba(94,246,255,.12)}
.ripple{position:absolute;width:46px;height:46px;transform:translate(-50%,-50%);border:1.5px solid var(--cyan);border-radius:50%;box-shadow:0 0 0 10px rgba(94,246,255,.12)}
.bracket{position:absolute;border:1px solid var(--red-dim);border-left:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>Cyberpunk 2077 Browser &middot; touch controls mockup</h1>
  <div id="frames" style="display:contents"></div>
</div>
<script>
// Frame + glyph library (the same shapes will be used by touch.js).
const cut = (w, h, c) => `M${c},0 H${w} V${h - c} L${w - c},${h} H0 V${c} Z`;   // top-left + bottom-right cut
const frameSvg = (inner) => `<svg class="f" viewBox="0 0 100 100" preserveAspectRatio="none"><path class="o" d="${cut(100, 100, 18)}"/>${inner ? `<path class="i" d="M24,8 H92 V70"/>` : ''}</svg>`;
const G = {
  fire: '<circle cx="12" cy="12" r="6"/><path d="M12 1v5M12 18v5M1 12h5M18 12h5"/><circle cx="12" cy="12" r="1" fill="currentColor"/>',
  aim: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/>',
  reload: '<path d="M19 12a7 7 0 1 1-2.1-5"/><path d="M19 3v5h-5"/>',
  jump: '<path d="M5 13l7-7 7 7"/><path d="M5 19l7-7 7 7"/>',
  crouch: '<path d="M5 5l7 7 7-7"/><path d="M4 19h16"/>',
  dodge: '<path d="M4 6l6 6-6 6"/><path d="M12 6l6 6-6 6"/>',
  weapon: '<path d="M3 9h15l2 2v2H11l-1 6H6l1-6H3z"/><path d="M14 13v2"/>',
  heal: '<rect x="4" y="4" width="16" height="16"/><path d="M12 8v8M8 12h8"/>',
  scan: '<path d="M2 12s4-6 10-6 10 6 10 6-4 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.5"/>',
  map: '<path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/>',
  menu: '<path d="M4 6h16M4 12h16M4 18h10"/>',
  fs: '<path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/>',
  up: '<path d="M5 15l7-7 7 7"/>', down: '<path d="M5 9l7 7 7-7"/>',
  left: '<path d="M15 5l-7 7 7 7"/>', right: '<path d="M9 5l7 7-7 7"/>',
  select: '<path d="M4 12l5 5L20 6"/>',
  throttle: '<path d="M12 4l7 9H5z"/><path d="M12 13v7"/>',
  brake: '<path d="M12 20l7-9H5z"/><path d="M12 11V4"/>',
  hand: '<rect x="4" y="4" width="16" height="16"/><path d="M9 17V7h4a3 3 0 0 1 0 6H9"/>',
  exit: '<path d="M10 4H4v16h6"/><path d="M14 8l4 4-4 4M18 12H8"/>',
  horn: '<path d="M3 10v4h4l6 4V6L7 10z"/><path d="M16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/>',
  camera: '<rect x="3" y="7" width="18" height="12"/><circle cx="12" cy="13" r="3.5"/><path d="M8 7l2-3h4l2 3"/>',
  radio: '<rect x="3" y="8" width="18" height="12"/><circle cx="15" cy="14" r="3"/><path d="M6 12h4M6 16h4M7 8l9-5"/>',
  back: '<path d="M10 6l-6 6 6 6"/><path d="M4 12h16"/>',
  interact: '<path d="M8 12V5a1.5 1.5 0 0 1 3 0v6M11 10V4a1.5 1.5 0 0 1 3 0v7M14 10a1.5 1.5 0 0 1 3 0v4c0 4-2 7-6 7s-5-2-7-6l-1-3a1.5 1.5 0 0 1 2.6-1.4L8 13"/>',
};
const glyph = (n, cls = 'g') => `<svg class="${cls}" viewBox="0 0 24 24">${G[n]}</svg>`;
const btn = (x, y, w, icon, label, key, opt = {}) =>
  `<div class="c" style="left:${x}px;top:${y}px"><div class="btn ${opt.primary ? 'primary' : ''} ${opt.hot ? 'hot' : ''}" style="--w:${w}px">${frameSvg(opt.primary)}${glyph(icon)}${key ? `<span class="key">${key}</span>` : ''}</div>${label ? `<div class="lbl">${label}</div>` : ''}</div>`;
const chip = (icon, label, key, h) => `<div class="chip" style="${h ? '--h:' + h + 'px' : ''}"><svg class="f" viewBox="0 0 100 100" preserveAspectRatio="none"><path class="o" d="${cut(100, 100, 22)}"/></svg>${key ? `<span class="k">${key}</span>` : ''}${icon ? glyph(icon) : ''}${label ? `<span>${label}</span>` : ''}</div>`;
const at = (x, y, html, anchor = '-50%,-50%') => `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(${anchor})">${html}</div>`;
const stick = (x, y, w, spr) => `<div class="c" style="left:${x}px;top:${y}px"><div class="stick" style="--w:${w}px"><svg viewBox="-60 -60 120 120">
  ${spr ? '<circle class="spr" r="56"/>' : ''}<circle class="ring" r="44"/>
  ${[0, 45, 90, 135, 180, 225, 270, 315].map(a => `<line class="tick" x1="0" y1="-44" x2="0" y2="${a % 90 ? -40 : -38}" transform="rotate(${a})"/>`).join('')}
  <circle class="knob" r="14" cx="${spr ? 0 : 0}" cy="${spr ? -18 : 0}"/></svg></div><div class="lbl">${spr ? 'Move &middot; push out = sprint' : 'Move'}</div></div>`;
const note = (x, y, t) => `<div class="note" style="left:${x}px;top:${y}px">${t}</div>`;
const strip = (items) => `<div class="strip">${items.map(([i, l, k]) => chip(i, l, k)).join('')}</div>`;

const frames = [
  {id: 'foot', title: 'On foot', desc: 'Weapon holstered. Stick on the left, JUMP under the right thumb, INTERACT only while the game shows a prompt.', bg: 'mockup-bg.png', html:
    strip([['scan', 'Scan', 'TAB'], ['map', 'Map', 'M'], ['menu', '', 'ESC'], ['fs', '', '']]) +
    stick(220, 460, 128, true) +
    btn(1140, 540, 82, 'jump', 'Jump', '', {primary: true}) +
    btn(1040, 600, 56, 'crouch', 'Crouch', 'C') +
    btn(1046, 488, 56, 'weapon', 'Draw', '1') +
    btn(952, 566, 48, 'dodge', 'Dodge', '') +
    at(800, 395, chip('interact', 'Interact', 'F', 40)) +
    note(700, 432, 'only while the game shows an interaction prompt') },
  {id: 'combat', title: 'Weapon drawn', desc: 'FIRE is the big button; AIM / RELOAD around it. Dragging FIRE or AIM also turns the camera.', bg: 'mockup-bg.png', html:
    strip([['scan', 'Scan', 'TAB'], ['map', 'Map', 'M'], ['menu', '', 'ESC'], ['fs', '', '']]) +
    stick(220, 460, 128, false) +
    btn(1138, 530, 94, 'fire', 'Fire', '', {primary: true, hot: true}) +
    btn(1026, 462, 62, 'aim', 'Aim', '') +
    btn(1150, 404, 52, 'reload', 'Reload', 'R') +
    btn(1028, 592, 52, 'jump', '', '') +
    btn(938, 618, 46, 'crouch', '', 'C') +
    btn(930, 520, 46, 'heal', '', 'X') +
    btn(1234, 456, 44, 'weapon', '', '1') +
    btn(925, 430, 44, 'dodge', '', '') },
  {id: 'vehicle', title: 'Driving', desc: 'Steering pad left (A/D), THROTTLE and BRAKE/REVERSE pedals right (W/S), handbrake, horn, exit.', bg: 'mockup-bg.png', html:
    strip([['camera', 'Cam', 'Q'], ['radio', 'Radio', 'R'], ['map', 'Map', 'M'], ['menu', '', 'ESC'], ['fs', '', '']]) +
    at(215, 500, `<div class="steer">${`<svg class="f" viewBox="0 0 100 100" preserveAspectRatio="none"><path class="o" d="${cut(100, 100, 20)}"/></svg>`}${glyph('left')}<div class="mid"></div><div class="knob"></div>${glyph('right')}</div><div class="lbl" style="text-align:center;margin-top:4px">Steer</div>`) +
    at(1170, 505, `<div class="pedal primary" style="--pw:74px;--ph:170px"><svg class="f" viewBox="0 0 100 100" preserveAspectRatio="none"><path class="o" d="${cut(100, 100, 14)}"/><path class="i" d="M22,6 H92 V60"/></svg>${glyph('throttle')}<span class="lbl">Gas</span></div>`) +
    at(1076, 530, `<div class="pedal" style="--pw:74px;--ph:120px"><svg class="f" viewBox="0 0 100 100" preserveAspectRatio="none"><path class="o" d="${cut(100, 100, 16)}"/></svg>${glyph('brake')}<span class="lbl">Brake</span></div>`) +
    btn(980, 566, 54, 'hand', 'Handbrake', 'SPC') +
    btn(984, 470, 44, 'horn', '', 'E') +
    at(1140, 372, chip('exit', 'Exit', 'F', 34)) },
  {id: 'dialogue', title: 'Dialogue choices', desc: 'Only choice up / down and SELECT, next to the game\'s choice list. Everything else hides.', bg: 'mockup-dialog.png', html:
    `<div class="bracket" style="left:760px;top:500px;width:60px;height:60px"></div>` +
    btn(872, 478, 50, 'up', '', '') +
    btn(872, 580, 50, 'down', '', '') +
    btn(975, 529, 80, 'select', 'Select', 'F', {primary: true}) +
    at(1110, 618, chip('', 'Skip', 'SPC', 30)) },
  {id: 'menu', title: 'Menus / map / scanner', desc: 'Taps are clicks where you touch, drag = drag, two fingers = scroll. Only BACK and fullscreen stay.', bg: 'mockup-bg.png', dim: true, html:
    at(24, 20, `<div style="display:flex;gap:6px">${chip('back', 'Back', 'ESC', 32)}${chip('fs', '', '', 32)}</div>`, '0,0') +
    `<div class="ripple" style="left:640px;top:330px"></div>` +
    note(672, 318, 'tap = click here  ·  drag = drag  ·  2 fingers = scroll') },
];

const one = new URLSearchParams(location.search).get('ctx');
if (one) document.body.classList.add('single');
const host = document.getElementById('frames');
for (const f of frames) {
  if (one && f.id !== one) continue;
  host.insertAdjacentHTML('beforeend', `<div class="cap"><b>${f.title}</b><span>${f.desc}</span></div>
    <div class="scaler" id="ctx-${f.id}"><div class="frame ${f.dim ? 'dim' : ''}" style="background-image:url(${f.bg})">${f.html}</div></div>`);
}
const fit = () => document.querySelectorAll('.scaler').forEach(s => { s.firstElementChild.style.transform = `scale(${s.clientWidth / 1280})`; });
addEventListener('resize', fit); fit();
</script>
</body>
</html>
